org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# BouncyCastle (SMB recording logons) ships Java 25 classes in its
# multi-release jar, which Jetifier cannot read; it has no support-library
# references to rewrite anyway.
android.jetifier.ignorelist=bcprov-jdk18on

# Performance optimizations for TV
android.enableR8.fullMode=true
org.gradle.caching=true
org.gradle.parallel=true
android.enableDexingArtifactTransform=true
org.gradle.configureondemand=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
