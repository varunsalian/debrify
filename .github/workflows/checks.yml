name: Code health checks

on:
  pull_request:
  push:
    branches: [main, 'refactor/**']

permissions:
  contents: read

jobs:
  file-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Repo-wide ratchet: over-limit files may only shrink, new files stay
      # within 800 lines. Baseline: dev/tool/file_size_baseline.txt.
      - run: python3 dev/tool/check_file_sizes.py

  search-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Scoped to migrated code: the rest of the repo predates formatting
      # enforcement and is not bulk-reformatted by this migration.
      - run: dart format --output=none --set-exit-if-changed lib/features lib/screens/search_screen.dart lib/screens/search_screen test/features
      - run: python3 dev/tool/check_search_architecture.py
      - run: flutter analyze --no-fatal-infos lib/features lib/screens/search_screen.dart lib/screens/search_screen
