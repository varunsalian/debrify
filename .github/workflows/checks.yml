name: Search architecture checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  search-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Scoped to migrated code: the rest of the repo predates formatting
      # enforcement and is not bulk-reformatted by this migration.
      - run: dart format --output=none --set-exit-if-changed lib/features lib/screens/search_screen.dart test/features
      - run: python3 dev/tool/check_search_architecture.py
      - run: flutter analyze --no-fatal-infos lib/features lib/screens/search_screen.dart
