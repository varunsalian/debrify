name: Code health checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, 'refactor/**']
    # Docs-only pushes need no app checks.
    paths-ignore: ['docs/**', '**/*.md']

# A newer push to the same branch supersedes an in-progress quick run
# (private-repo Actions minutes are metered). A run that includes a gate or
# [full-ci] commit gets its own group, keyed by commit, so a later push can
# never cancel its behaviour suite.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ (contains(join(github.event.commits.*.message, ' '), 'gate') || contains(join(github.event.commits.*.message, ' '), '[full-ci]')) && github.sha || 'quick' }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  file-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Repo-wide ratchet: over-limit files may only shrink, new files stay
      # within 800 lines. Baseline: dev/tool/file_size_baseline.txt.
      - run: python3 dev/tool/check_file_sizes.py
      - run: python3 dev/tool/check_storage_keys.py
      - run: python3 dev/tool/check_storage_references.py --self-test

  search-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Scoped to migrated code: the rest of the repo predates formatting
      # enforcement and is not bulk-reformatted by this migration.
      - run: dart format --output=none --set-exit-if-changed lib/features lib/screens/settings_screen.dart lib/screens/search_screen.dart lib/screens/search_screen lib/services/torrent_playback_service.dart lib/services/video_player_launcher.dart lib/services/storage lib/models/ambient_trailer_surface.dart lib/models/tv_render_quality.dart lib/widgets/iptv/iptv_results_view.dart lib/screens/torbox/torbox_downloads_screen.dart lib/screens/debrid_downloads_screen.dart lib/screens/pikpak/pikpak_files_screen.dart lib/screens/settings/external_player_settings_page.dart test/features test/support/settings_golden.dart test/support/iptv_results_fixture.dart test/support/iptv_results_source.dart test/support/torbox_downloads_fixture.dart test/support/torbox_downloads_source.dart test/support/debrid_downloads_fixture.dart test/support/debrid_downloads_source.dart test/support/pikpak_files_fixture.dart test/support/pikpak_files_source.dart test/support/playback_settings_fixture.dart test/support/playback_settings_profiles.dart test/provider_source_picker_web_download_test.dart test/settings_spotlight_shell_test.dart test/settings_tv_spotlight_layout_test.dart lib/screens/settings/iptv_settings_page.dart test/support/iptv_settings_fixture.dart test/support/iptv_settings_held_boundaries.dart test/support/iptv_settings_source.dart test/support/iptv_settings_removal_probe.dart lib/services/iptv_catalog_refresh_service.dart lib/screens/playlist_content_view_screen.dart test/support/playlist_content_fixture.dart test/support/playlist_content_images.dart test/support/playlist_content_profile.dart test/support/playlist_content_source.dart test/support/profile_fixture.dart lib/screens/merged_series_detail_screen.dart test/support/merged_detail_fixture.dart test/support/merged_detail_goldens.dart test/support/merged_detail_http_transport.dart test/support/merged_detail_source.dart lib/widgets/episodes_panel.dart test/support/episodes_panel_fixture.dart test/support/episodes_panel_source.dart
      - run: python3 dev/tool/check_search_architecture.py
      # Migrated destinations and their facades are both covered. Warnings that
      # predate a move-only extraction are recorded in analyzer_allowlist.txt;
      # any other warning, any error, or a stale entry fails.
      - run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/features lib/screens/settings_screen.dart lib/screens/search_screen.dart lib/screens/search_screen lib/services/torrent_playback_service.dart lib/services/video_player_launcher.dart lib/services/storage lib/models/ambient_trailer_surface.dart lib/models/tv_render_quality.dart lib/widgets/iptv/iptv_results_view.dart lib/screens/torbox/torbox_downloads_screen.dart lib/screens/debrid_downloads_screen.dart lib/screens/pikpak/pikpak_files_screen.dart lib/screens/settings/external_player_settings_page.dart lib/screens/settings/iptv_settings_page.dart lib/screens/playlist_content_view_screen.dart lib/screens/merged_series_detail_screen.dart lib/widgets/episodes_panel.dart | tee analyze.txt
          python3 dev/tool/check_analyzer_allowlist.py analyze.txt

  sources-behavior:
    # The ~8-minute behaviour suite runs on PRs, main, manual runs, and on
    # refactor pushes where ANY pushed commit's message marks a full-suite gate
    # ("gate") or asks for it ("[full-ci]"). Every push still gets the cheap
    # size, architecture, format and analyzer jobs above.
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      contains(join(github.event.commits.*.message, ' '), 'gate') ||
      contains(join(github.event.commits.*.message, ' '), '[full-ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Sources/TorrentPlaybackService behaviour tests. Fails on any failure
      # not listed by exact identity, and on a listed one that passes or is gone.
      - run: python3 dev/tool/suite_evidence.py check dev/tool/ci_behavior_known_failures.txt @dev/tool/ci_behavior_tests.txt
      # Keep the exact runner error/trace when a CI-only failure needs review.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sources-behavior-evidence
          path: |
            /tmp/suite_evidence_check-*.jsonl
            /tmp/suite_evidence_check-*.stderr
            test/failures/
          retention-days: 7
