name: Search architecture checks

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  search-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - run: python3 dev/tool/check_search_architecture.py
      - run: flutter analyze --no-fatal-infos lib/features lib/screens/search_screen.dart
