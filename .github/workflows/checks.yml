name: Code health checks

on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main, 'refactor/**']

# A newer push to the same branch supersedes an in-progress quick run
# (private-repo Actions minutes are metered). A run that includes a gate or
# [full-ci] commit gets its own group, keyed by commit, so a later push can
# never cancel its behaviour suite.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}-${{ (contains(join(github.event.commits.*.message, ' '), 'gate') || contains(join(github.event.commits.*.message, ' '), '[full-ci]')) && github.sha || 'quick' }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  file-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Repo-wide ratchet: over-limit files may only shrink, new files stay
      # within 800 lines. Baseline: dev/tool/file_size_baseline.txt.
      - run: python3 dev/tool/check_file_sizes.py
      - run: python3 dev/tool/check_storage_keys.py
      - run: python3 dev/tool/check_storage_references.py --self-test

  tvplayer-structure:
    # Every push, including decision-only completion gates; no gate-message filter.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Set Kotlin tool locations
        run: |
          echo "GRADLE_USER_HOME=$RUNNER_TEMP/tvplayer-gradle" >> "$GITHUB_ENV"
          echo "TVPLAYER_EVIDENCE_ROOT=$RUNNER_TEMP/tvplayer-evidence" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: ${{ env.GRADLE_USER_HOME }}/caches/modules-2/files-2.1
          key: tvplayer-kotlin-${{ runner.os }}-${{ hashFiles('dev/tool/kotlin_artifacts.json') }}
      # Always verify/provision all five pins; a warm cache is optional.
      - run: python3 dev/tool/bootstrap_kotlin_tools.py
      - run: python3 dev/tool/check_kotlin_moves.py --manifest dev/tool/kotlin_moves/tvplayer_p19.json --self-test
      - run: python3 dev/tool/check_kotlin_moves.py --manifest dev/tool/kotlin_moves/tvplayer_p19.json
      - run: python3 dev/tool/test_tvplayer_host_usage.py
      - run: python3 dev/tool/check_tvplayer_boundaries.py --self-test
      - run: python3 dev/tool/check_tvplayer_boundaries.py

  search-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Scoped to migrated code: the rest of the repo predates formatting
      # enforcement and is not bulk-reformatted by this migration.
      - run: dart format --output=none --set-exit-if-changed lib/features lib/screens/settings_screen.dart lib/screens/video_player_screen.dart lib/screens/search_screen.dart lib/screens/search_screen lib/services/torrent_playback_service.dart lib/services/video_player_launcher.dart lib/services/storage lib/models/ambient_trailer_surface.dart lib/models/tv_render_quality.dart lib/widgets/iptv/iptv_results_view.dart lib/screens/torbox/torbox_downloads_screen.dart lib/screens/debrid_downloads_screen.dart lib/screens/pikpak/pikpak_files_screen.dart lib/screens/settings/external_player_settings_page.dart test/features test/support/settings_golden.dart test/support/iptv_results_fixture.dart test/support/iptv_results_source.dart test/support/torbox_downloads_fixture.dart test/support/torbox_downloads_source.dart test/support/debrid_downloads_fixture.dart test/support/debrid_downloads_source.dart test/support/pikpak_files_fixture.dart test/support/pikpak_files_source.dart test/support/playback_settings_fixture.dart test/support/playback_settings_profiles.dart test/android_tv_mdblist_progress_source_test.dart test/provider_source_picker_web_download_test.dart test/settings_spotlight_shell_test.dart test/settings_tv_spotlight_layout_test.dart lib/screens/settings/iptv_settings_page.dart test/support/iptv_settings_fixture.dart test/support/iptv_settings_held_boundaries.dart test/support/iptv_settings_source.dart test/support/iptv_settings_removal_probe.dart lib/services/iptv_catalog_refresh_service.dart lib/screens/playlist_content_view_screen.dart test/support/playlist_content_fixture.dart test/support/playlist_content_images.dart test/support/playlist_content_profile.dart test/support/playlist_content_source.dart test/support/profile_fixture.dart lib/screens/merged_series_detail_screen.dart test/support/merged_detail_fixture.dart test/support/merged_detail_goldens.dart test/support/merged_detail_http_transport.dart test/support/merged_detail_source.dart lib/screens/addons/addon_hub_screen.dart test/support/addon_hub_fixture.dart test/support/addon_hub_source.dart test/support/addon_hub_profiles.dart lib/widgets/detail/showcase_parts.dart test/support/detail_showcase_*.dart lib/widgets/home/spotlight_board.dart test/support/spotlight_board_fixture.dart test/support/spotlight_board_source.dart lib/widgets/episodes_panel.dart test/support/episodes_panel_fixture.dart test/support/episodes_panel_source.dart lib/screens/catalog_item_detail_screen.dart test/support/catalog_detail_fixture.dart test/support/catalog_detail_goldens.dart test/support/catalog_detail_http_transport.dart test/support/catalog_detail_metadata_responses.dart test/support/catalog_detail_poster.dart test/support/catalog_detail_source.dart dev/tool/catalog_detail_tmdb_fixture.dart.txt lib/screens/magic_tv_screen.dart test/support/debrify_tv_*.dart lib/screens/stremio_tv/widgets/stremio_tv_local_catalogs_dialog.dart test/support/stremio_tv_catalogs_*.dart lib/screens/settings/widgets/settings_widgets.dart test/support/settings_widgets_*.dart lib/screens/stremio_tv/widgets/stremio_tv_tuner.dart test/support/stremio_tv_tuner_*.dart lib/screens/stremio_tv/stremio_tv_screen.dart test/support/stremio_tv_*.dart test/support/edit_profile_fixture.dart test/support/edit_profile_source.dart lib/screens/profiles/edit_profile_screen.dart lib/widgets/iptv/spotlight/spotlight_live_timeline.dart test/support/iptv_spotlight_timeline_*.dart lib/screens/settings/iptv_settings_two_pane.dart lib/features/iptv_settings_two_pane test/support/iptv_settings_two_pane_*.dart lib/screens/settings/recordings_page.dart test/support/recordings_*.dart lib/screens/premiumize/premiumize_files_screen.dart test/support/premiumize_*.dart lib/screens/alldebrid/alldebrid_files_screen.dart test/support/alldebrid_files_*.dart test/media_server_player_resume_test.dart test/manual_source_validation_contract_test.dart test/media_server_watch_player_wiring_test.dart test/services/webdav_sync/playback_checkpoint_contract_test.dart
      - run: python3 dev/tool/check_search_architecture.py
      - run: python3 dev/tool/vplayer_architecture_test.py
      # First production video_player files: exhaustive ownership/history and
      # frozen scaffolding checks use separate tool-only parser packages.
      # Phase 16 owns startup and source switching; all accepted seam patches stay frozen.
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p16.json --self-test --parser-package .dart_tool/vplayer_parser/ci_moves_self/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p16.json --parser-package .dart_tool/vplayer_parser/ci_moves_current/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p1.json --at 31a347ad2 --parser-package .dart_tool/vplayer_parser/ci_moves_p1_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p2.json --at fc24e32ae --parser-package .dart_tool/vplayer_parser/ci_moves_p2_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p3.json --at 890df14d8 --parser-package .dart_tool/vplayer_parser/ci_moves_p3_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p4.json --at 315028407 --parser-package .dart_tool/vplayer_parser/ci_moves_p4_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p5.json --at ea7901ead --parser-package .dart_tool/vplayer_parser/ci_moves_p5_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p6.json --at 2defa5100 --parser-package .dart_tool/vplayer_parser/ci_moves_p6_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p7.json --at 491bf1fea --parser-package .dart_tool/vplayer_parser/ci_moves_p7_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p8.json --at 0df6ccd4e --parser-package .dart_tool/vplayer_parser/ci_moves_p8_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p9.json --at 5c7b704bd --parser-package .dart_tool/vplayer_parser/ci_moves_p9_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p10.json --at 7fdf59370 --parser-package .dart_tool/vplayer_parser/ci_moves_p10_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p11.json --at 0c2fb62e8 --parser-package .dart_tool/vplayer_parser/ci_moves_p11_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p12.json --at 1d7699d2e --parser-package .dart_tool/vplayer_parser/ci_moves_p12_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p13.json --at 238df16f4 --parser-package .dart_tool/vplayer_parser/ci_moves_p13_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p14.json --at be4cd78aa --parser-package .dart_tool/vplayer_parser/ci_moves_p14_history/.dart_tool/package_config.json
      - run: python3 dev/tool/check_dart_moves.py --manifest dev/tool/dart_moves/vplayer_p15.json --at ed7c6717a --parser-package .dart_tool/vplayer_parser/ci_moves_p15_history/.dart_tool/package_config.json
      # S remains frozen; S2 through S2e preserve all platform checkpoints.
      - run: python3 dev/tool/vplayer_seam_proof.py --self-test --parser-package .dart_tool/vplayer_parser/ci_seam/.dart_tool/package_config.json
      # S2e: exactly two candidate reads; no P15 placeholder/history exemption.
      - run: python3 dev/tool/vplayer_platform_seam_proof.py --self-test --parser-package .dart_tool/vplayer_parser/ci_platform_seam/.dart_tool/package_config.json
      - run: python3 dev/tool/recordings_architecture_test.py
      - run: python3 dev/tool/alldebrid_files_architecture_test.py
      - run: python3 dev/tool/stremio_tv_catalogs_architecture_test.py
      - run: python3 dev/tool/iptv_spotlight_timeline_architecture_test.py
      # settings_widgets: prove completion/import/size guards through the real main.
      - run: python3 dev/tool/settings_widgets_architecture_test.py
      - run: python3 dev/tool/iptv_settings_two_pane_architecture_test.py
      - run: python3 dev/tool/premiumize_architecture_test.py
      # Migrated destinations and their facades are both covered. Warnings that
      # predate a move-only extraction are recorded in analyzer_allowlist.txt;
      # any other warning, any error, or a stale entry fails.
      - run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings lib/features lib/screens/settings_screen.dart lib/screens/video_player_screen.dart lib/screens/search_screen.dart lib/screens/search_screen lib/services/torrent_playback_service.dart lib/services/video_player_launcher.dart lib/services/storage lib/models/ambient_trailer_surface.dart lib/models/tv_render_quality.dart lib/widgets/iptv/iptv_results_view.dart lib/screens/torbox/torbox_downloads_screen.dart lib/screens/debrid_downloads_screen.dart lib/screens/pikpak/pikpak_files_screen.dart lib/screens/settings/external_player_settings_page.dart lib/screens/settings/iptv_settings_page.dart lib/screens/playlist_content_view_screen.dart lib/screens/merged_series_detail_screen.dart lib/screens/addons/addon_hub_screen.dart lib/widgets/detail/showcase_parts.dart lib/widgets/home/spotlight_board.dart lib/widgets/episodes_panel.dart lib/screens/catalog_item_detail_screen.dart lib/screens/magic_tv_screen.dart lib/screens/stremio_tv/widgets/stremio_tv_local_catalogs_dialog.dart lib/screens/settings/widgets/settings_widgets.dart lib/screens/stremio_tv/widgets/stremio_tv_tuner.dart lib/screens/stremio_tv/stremio_tv_screen.dart lib/screens/profiles/edit_profile_screen.dart lib/widgets/iptv/spotlight/spotlight_live_timeline.dart test/support/iptv_spotlight_timeline_*.dart lib/screens/settings/iptv_settings_two_pane.dart lib/features/iptv_settings_two_pane test/support/iptv_settings_two_pane_*.dart lib/screens/settings/recordings_page.dart lib/screens/premiumize/premiumize_files_screen.dart test/support/premiumize_*.dart lib/screens/alldebrid/alldebrid_files_screen.dart test/support/alldebrid_files_*.dart | tee analyze.txt
          python3 dev/tool/check_analyzer_allowlist.py analyze.txt
          python3 dev/tool/check_vplayer_analyzer.py analyze.txt --manifest dev/tool/dart_moves/vplayer_p16.json --inventory dev/tool/dart_moves/vplayer_p16_analyzer.json --self-test --parser-package .dart_tool/vplayer_parser/ci_analyzer/.dart_tool/package_config.json
          python3 dev/tool/check_recordings_analyzer.py analyze.txt --parser-package .dart_tool/recordings_parser/ci_analyzer/.dart_tool/package_config.json
          python3 dev/tool/check_stremio_tv_tuner_analyzer.py analyze.txt --parser-package .dart_tool/stremio_tv_tuner_parser/ci_analyzer/.dart_tool/package_config.json
          python3 dev/tool/check_iptv_spotlight_timeline_analyzer.py analyze.txt --parser-package .dart_tool/iptv_spotlight_timeline_parser/ci_analyzer/.dart_tool/package_config.json

  sources-behavior:
    # The ~8-minute behaviour suite runs on PRs, main, manual runs, and on
    # refactor pushes where ANY pushed commit's message marks a full-suite gate
    # ("gate") or asks for it ("[full-ci]"). Every push still gets the cheap
    # size, architecture, format and analyzer jobs above.
    if: >-
      github.event_name != 'push' ||
      github.ref == 'refs/heads/main' ||
      contains(join(github.event.commits.*.message, ' '), 'gate') ||
      contains(join(github.event.commits.*.message, ' '), '[full-ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Sources/TorrentPlaybackService behaviour tests. Fails on any failure
      # not listed by exact identity, and on a listed one that passes or is gone.
      - run: python3 dev/tool/suite_evidence.py check dev/tool/ci_behavior_known_failures.txt @dev/tool/ci_behavior_tests.txt --dart-define=SETTINGS_WIDGETS_REQUIRE_ORIGINAL_LINUX=true --dart-define=PREMIUMIZE_REQUIRE_ORIGINAL_LINUX=true --dart-define=DEBRIFY_VP_TEST_HOOKS=true --concurrency=1
      # Keep the exact runner error/trace when a CI-only failure needs review.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sources-behavior-evidence
          path: |
            /tmp/suite_evidence_check-*.jsonl
            /tmp/suite_evidence_check-*.stderr
            test/failures/
          retention-days: 7
