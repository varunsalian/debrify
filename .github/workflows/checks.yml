name: Code health checks

on:
  pull_request:
  push:
    branches: [main, 'refactor/**']

permissions:
  contents: read

jobs:
  file-sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Repo-wide ratchet: over-limit files may only shrink, new files stay
      # within 800 lines. Baseline: dev/tool/file_size_baseline.txt.
      - run: python3 dev/tool/check_file_sizes.py
      - run: python3 dev/tool/check_storage_keys.py
      - run: python3 dev/tool/check_storage_references.py --self-test

  search-architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Scoped to migrated code: the rest of the repo predates formatting
      # enforcement and is not bulk-reformatted by this migration.
      - run: dart format --output=none --set-exit-if-changed lib/features lib/screens/settings_screen.dart lib/screens/search_screen.dart lib/screens/search_screen lib/services/torrent_playback_service.dart lib/services/video_player_launcher.dart lib/services/storage lib/models/ambient_trailer_surface.dart lib/models/tv_render_quality.dart test/features test/support/settings_golden.dart test/settings_spotlight_shell_test.dart test/settings_tv_spotlight_layout_test.dart
      - run: python3 dev/tool/check_search_architecture.py
      # Settings destinations and its completed facade are both covered.
      - run: flutter analyze --no-fatal-infos lib/features lib/screens/settings_screen.dart lib/screens/search_screen.dart lib/screens/search_screen lib/services/torrent_playback_service.dart lib/services/video_player_launcher.dart lib/services/storage lib/models/ambient_trailer_surface.dart lib/models/tv_render_quality.dart

  sources-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # Sources/TorrentPlaybackService behaviour tests. Fails on any failure
      # not listed by exact identity, and on a listed one that passes or is gone.
      - run: python3 dev/tool/suite_evidence.py check dev/tool/ci_behavior_known_failures.txt @dev/tool/ci_behavior_tests.txt
      # Keep the exact runner error/trace when a CI-only failure needs review.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: sources-behavior-evidence
          path: |
            /tmp/suite_evidence_check.jsonl
            /tmp/suite_evidence_check.stderr
            test/failures/
          retention-days: 7
