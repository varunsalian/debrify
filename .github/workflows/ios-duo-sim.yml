name: iPhone Duo simulator check

# Throwaway check for the ios-xcode-27 work. Runs integration_test/duo_tour_test.dart
# on GitHub's iPhone Duo simulator while a host loop folds, unfolds, rotates
# and screenshots it on the test's request.
on:
  push:
    branches: [ios-duo-sim-check]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  duo:
    runs-on: xcode-27
    timeout-minutes: 75
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Get dependencies
      run: |
        flutter pub get
        xcodebuild -version
        xcrun --sdk iphonesimulator --show-sdk-version

    # duoctl drives the simulator's hinge through private interfaces, so it is
    # pinned to a reviewed commit rather than installed from a moving tap.
    - name: Install duoctl v0.2.1
      run: |
        set -euo pipefail
        git clone --depth 1 --branch v0.2.1 https://github.com/skarol/duoctl.git "$RUNNER_TEMP/duoctl"
        test "$(git -C "$RUNNER_TEMP/duoctl" rev-parse HEAD)" = c6ff3e961a9858fb061907448e702d7d1617dc4a
        echo "$RUNNER_TEMP/duoctl/bin" >> "$GITHUB_PATH"

    - name: Boot iPhone Duo simulator
      run: |
        set -uo pipefail
        runtime="$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["identifier"].endswith("iOS-27-1") and r["isAvailable"]))')"
        # A fresh Duo simulator sometimes finishes booting with no active
        # display. Poll for one, and recreate the simulator if it never comes.
        limit() { perl -e 'alarm shift; exec @ARGV' "$@"; }
        for attempt in 1 2 3; do
          udid="$(xcrun simctl create "ci-duo-$attempt" "iPhone Duo" "$runtime")"
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b > /dev/null
          export DUOCTL_UDID="$udid"
          for poll in $(seq 1 12); do
            if limit 30 duoctl state; then
              echo "DUOCTL_UDID=$udid" >> "$GITHUB_ENV"
              echo "simulator ready on attempt $attempt"
              exit 0
            fi
            sleep 10
          done
          echo "::warning::attempt $attempt: no active display, recreating the simulator"
          xcrun simctl shutdown "$udid" || true
          xcrun simctl delete "$udid" || true
        done
        echo "::error::iPhone Duo simulator never showed an active display"
        exit 1

    - name: Run the Duo tour
      run: |
        # GitHub runs steps with -e; the host loop must survive failed lookups.
        set +e
        set -uo pipefail
        out="$RUNNER_TEMP/duo"
        mkdir -p "$out"
        bundle=com.varunsalian.debrify

        # Answers the test's req-N files with ack-N. The request file is
        # searched for under the simulator's data folder, because the app's
        # temp folder is not where get_app_container points on iOS 27.1.
        data_root="$HOME/Library/Developer/CoreSimulator/Devices/$DUOCTL_UDID/data"
        host_loop() {
          local seq=0 dir="" cmd name rc next
          while :; do
            next=""
            [ -n "$dir" ] && [ -f "$dir/req-$((seq + 1))" ] && next="$dir/req-$((seq + 1))"
            if [ -z "$next" ]; then
              next="$(find "$data_root" -maxdepth 10 -type f -name "req-$((seq + 1))" 2>/dev/null | head -n 1 || true)"
            fi
            if [ -z "$next" ]; then
              sleep 0.5
              continue
            fi
            if [ "$(dirname "$next")" != "$dir" ]; then
              dir="$(dirname "$next")"
              echo "sync dir: $dir"
            fi
            seq=$((seq + 1))
            cmd="$(cat "$next")"
            echo "[$(date +%T)] $seq: $cmd"
            case "$cmd" in
              "shot "*)
                name="${cmd#shot }"
                duoctl state > "$out/$name.json" && duoctl screenshot "$out/$name.png"
                rc=$?
                ;;
              end)
                cp "$dir/summary.txt" "$out/" 2>/dev/null
                rc=0
                ;;
              *)
                duoctl $cmd
                rc=$?
                ;;
            esac
            echo "$rc" > "$dir/ack-$seq.tmp" && mv "$dir/ack-$seq.tmp" "$dir/ack-$seq"
            [ "$cmd" = end ] && return 0
          done
        }

        host_loop > "$out/host.log" 2>&1 &
        host_pid=$!

        # The tour plays this clip through the real player; the simulator
        # shares the runner's network, so localhost reaches it.
        python3 -m http.server 8765 --bind 127.0.0.1 --directory integration_test/assets > "$out/http.log" 2>&1 &
        http_pid=$!

        flutter test integration_test/duo_tour_test.dart -d "$DUOCTL_UDID" \
          --dart-define=DEBRIFY_LOCAL_VALIDATION=false 2>&1 | tee "$out/flutter_test.log"
        rc=${PIPESTATUS[0]}

        kill "$host_pid" "$http_pid" 2>/dev/null || true
        echo "::group::host log"; cat "$out/host.log"; echo "::endgroup::"
        cat "$out/summary.txt" 2>/dev/null || echo "no summary written"
        xcrun simctl spawn "$DUOCTL_UDID" log show --last 60m --style compact \
          --predicate 'process == "Runner"' > "$out/runner.log" 2>&1 || true
        find ~/Library/Logs/DiagnosticReports -iname '*Runner*' -exec cp {} "$out/" \; 2>/dev/null || true
        exit "$rc"

    - name: Upload screenshots and logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: iphone-duo-tour
        path: ${{ runner.temp }}/duo
        if-no-files-found: warn
