name: Build Release Artifacts

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      job:
        description: 'Job to run (or all)'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - android
          - macos
          - windows
          - ios
          - tvos
          - linux
          - linux-arm64

permissions:
  contents: write

jobs:
  android:
    if: github.event_name == 'release' || github.event.inputs.job == 'all' || github.event.inputs.job == 'android'
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        # 21, not 17: AGP 8.11.1 / Kotlin 2.2.20 / Gradle 8.14 came in with the
        # Flutter 3.44 upgrade, and 21 is the JDK the release APK was actually
        # verified on locally (Android Studio's JBR). 17 is still within AGP's
        # supported range, so this is alignment with what was tested rather
        # than a hard requirement.
        java-version: '21'

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Cache dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.pub-cache
          .dart_tool
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-deps-${{ hashFiles('**/pubspec.lock', '**/*.gradle*') }}
        restore-keys: |
          ${{ runner.os }}-deps-

    - name: Get dependencies
      run: flutter pub get

    - name: Decode keystore
      run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

    - name: Create key.properties
      run: |
        cat > android/key.properties << EOF
        storePassword=${{ secrets.KEYSTORE_PASSWORD }}
        keyPassword=${{ secrets.KEY_PASSWORD }}
        keyAlias=${{ secrets.KEY_ALIAS }}
        storeFile=release.keystore
        EOF

    - name: Build APK
      run: flutter build apk --release

    - name: Rename APK (release)
      if: github.event_name == 'release'
      run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/debrify-${{ github.event.release.tag_name }}.apk

    - name: Attach APK to GitHub Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: build/app/outputs/flutter-apk/debrify-${{ github.event.release.tag_name }}.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload APK as artifact (manual)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: debrify-android
        path: build/app/outputs/flutter-apk/app-release.apk

  macos:
    if: github.event_name == 'release' || github.event.inputs.job == 'all' || github.event.inputs.job == 'macos'
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build macOS app
      run: flutter build macos --release

    - name: Install create-dmg
      run: HOMEBREW_NO_AUTO_UPDATE=1 brew install create-dmg

    - name: Prepare DMG staging folder
      run: |
        cd build/macos/Build/Products/Release
        rm -rf dmg-root
        mkdir -p dmg-root
        cp -R debrify.app dmg-root/Debrify.app

    - name: Create DMG (release)
      if: github.event_name == 'release'
      run: |
        cd build/macos/Build/Products/Release
        create-dmg \
          --volname "Debrify" \
          --window-pos 200 120 \
          --window-size 520 360 \
          --icon-size 120 \
          --icon "Debrify.app" 120 180 \
          --app-drop-link 400 180 \
          debrify-${{ github.event.release.tag_name }}.dmg \
          dmg-root

    - name: Create DMG (manual)
      if: github.event_name == 'workflow_dispatch'
      run: |
        cd build/macos/Build/Products/Release
        create-dmg \
          --volname "Debrify" \
          --window-pos 200 120 \
          --window-size 520 360 \
          --icon-size 120 \
          --icon "Debrify.app" 120 180 \
          --app-drop-link 400 180 \
          debrify.dmg \
          dmg-root

    - name: Upload DMG to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: build/macos/Build/Products/Release/debrify-${{ github.event.release.tag_name }}.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload DMG as artifact (manual)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: debrify-macos
        path: build/macos/Build/Products/Release/debrify.dmg

  windows:
    if: github.event_name == 'release' || github.event.inputs.job == 'all' || github.event.inputs.job == 'windows'
    runs-on: windows-2022
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Enable Windows desktop
      run: flutter config --enable-windows-desktop

    - name: Get dependencies
      run: flutter pub get

    - name: Build Windows app
      run: flutter build windows --release

    - name: Install Inno Setup
      run: choco install innosetup --no-progress --yes

    - name: Build Windows installer
      shell: pwsh
      run: |
        $env:DEBRIFY_VERSION = '${{ github.event.release.tag_name || 'dev' }}'
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows\installer.iss

    - name: Upload Windows installer to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: build/windows/installer/debrify-${{ github.event.release.tag_name }}-setup.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload Windows installer as artifact (manual)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: debrify-windows
        path: build/windows/installer/debrify-dev-setup.exe

  ios:
    if: github.event_name == 'release' || github.event.inputs.job == 'all' || github.event.inputs.job == 'ios'
    runs-on: macos-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Get dependencies
      run: flutter pub get

    - name: Build iOS (unsigned)
      run: flutter build ios --release --no-codesign

    # --no-codesign emits Mach-Os with no LC_CODE_SIGNATURE, so __LINKEDIT has no
    # room reserved for a signature. Sideloaders (AltStore/ldid, Sideloadly) abort
    # with "ldid.cpp: _assert(): end >= size - 0x10". Ad-hoc signing reserves that
    # space; the sideloader replaces the signature with the user's own cert.
    - name: Ad-hoc sign for sideloading
      run: |
        set -euo pipefail
        APP=build/ios/iphoneos/Runner.app
        for d in "$APP"/Frameworks/*.dylib; do
          [ -f "$d" ] && codesign -f -s - --timestamp=none "$d"
        done
        for f in "$APP"/Frameworks/*.framework; do
          [ -d "$f" ] && codesign -f -s - --timestamp=none "$f"
        done
        codesign -f -s - --timestamp=none "$APP"

        # Fail loudly rather than shipping an uninstallable IPA.
        missing=0
        check() {
          if [ -f "$1" ] && [ "$(otool -l "$1" | grep -c LC_CODE_SIGNATURE)" -eq 0 ]; then
            echo "::error::no LC_CODE_SIGNATURE in $1"
            missing=$((missing + 1))
          fi
        }
        check "$APP/Runner"
        for d in "$APP"/Frameworks/*.dylib; do check "$d"; done
        for f in "$APP"/Frameworks/*.framework; do
          check "$f/$(basename "$f" .framework)"
        done
        if [ "$missing" -ne 0 ]; then
          echo "::error::$missing binary(ies) left unsigned; IPA would not sideload"
          exit 1
        fi
        echo "all binaries carry LC_CODE_SIGNATURE"

    - name: Create unsigned IPA (release)
      if: github.event_name == 'release'
      run: |
        cd build/ios/iphoneos
        mkdir -p Payload
        cp -R Runner.app Payload/
        zip -r debrify-${{ github.event.release.tag_name }}-unsigned.ipa Payload
        rm -rf Payload

    - name: Create unsigned IPA (manual)
      if: github.event_name == 'workflow_dispatch'
      run: |
        cd build/ios/iphoneos
        mkdir -p Payload
        cp -R Runner.app Payload/
        zip -r debrify-unsigned.ipa Payload
        rm -rf Payload

    - name: Upload IPA to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: build/ios/iphoneos/debrify-${{ github.event.release.tag_name }}-unsigned.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload IPA as artifact (manual)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: debrify-ios
        path: build/ios/iphoneos/debrify-unsigned.ipa

  tvos:
    if: github.event_name == 'release' || github.event.inputs.job == 'all' || github.event.inputs.job == 'tvos'
    runs-on: macos-latest
    env:
      # The fork publishes no tags and `dev` moves, so pin the SHA. Bumping this
      # is how the tvOS toolchain gets updated — nothing else here floats.
      FLUTTER_TVOS_REF: 0e32f18683c034acb336cd37d7310c6084ba7383
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # tvOS can't use subosito/flutter-action. The build needs the
    # fluttertv/flutter-tvos CLI, which clones its own pinned stock Flutter
    # (bin/internal/flutter.version, currently the 3.44.8 commit) and downloads
    # a tvOS engine artifact the stock SDK knows nothing about.
    - name: Setup flutter-tvos
      run: |
        set -euo pipefail
        git init --quiet "$HOME/flutter-tvos"
        git -C "$HOME/flutter-tvos" remote add origin https://github.com/fluttertv/flutter-tvos.git
        git -C "$HOME/flutter-tvos" fetch --depth 1 --quiet origin "$FLUTTER_TVOS_REF"
        git -C "$HOME/flutter-tvos" checkout --quiet FETCH_HEAD
        echo "$HOME/flutter-tvos/bin" >> "$GITHUB_PATH"

    # The first flutter-tvos invocation does the whole one-time setup: clones
    # the pinned stock Flutter SDK, compiles the CLI snapshot, then pulls the
    # ~1 GB tvOS engine artifact. Its own step so a toolchain failure doesn't
    # read as a build failure — and so the step name matches what's failing.
    - name: Bootstrap flutter-tvos and precache engine
      run: flutter-tvos precache

    # flutter-tvos, not flutter: tvos/Podfile reads the `tvos` plugin list out
    # of .flutter-plugins-dependencies, and only the fork's pub get writes that
    # section. Stock pub get produces a Podfile run that links no plugins.
    - name: Get dependencies
      run: flutter-tvos pub get

    # ~830 MB of prebuilt libmpv/ffmpeg xcframeworks, gitignored because they
    # are 2.7 GB extracted. Deliberately not cached: a cache entry this size
    # would crowd the repo's 10 GB budget and evict the Android job's.
    - name: Fetch libmpv tvOS frameworks
      run: packages/media_kit_libs_tvos_video/fetch_frameworks.sh

    # There is no `--no-codesign` for tvOS the way there is for `flutter build
    # ios`. The CLI reads DEVELOPMENT_TEAM out of tvos/Runner.xcodeproj and
    # passes `-allowProvisioningUpdates`, which cannot resolve a profile on a
    # runner with no Apple account. XCODE_XCCONFIG_FILE switches signing off for
    # the whole xcodebuild invocation without touching the tracked project. The
    # team ID the CLI passes on the command line still wins for that one
    # setting, but is inert once signing is disallowed — and the Runner target's
    # two codesign script phases already no-op when CODE_SIGNING_REQUIRED=NO.
    - name: Build tvOS (unsigned)
      run: |
        set -euo pipefail
        cat > "$RUNNER_TEMP/unsigned.xcconfig" <<'EOF'
        CODE_SIGN_IDENTITY =
        CODE_SIGNING_REQUIRED = NO
        CODE_SIGNING_ALLOWED = NO
        EOF
        export XCODE_XCCONFIG_FILE="$RUNNER_TEMP/unsigned.xcconfig"
        flutter-tvos build tvos --release

    # Same reason as the iOS job: an unsigned Mach-O reserves no __LINKEDIT
    # room for a signature, so Sideloadly/atvloadly abort in ldid before they
    # can re-sign with the user's own Apple ID.
    - name: Ad-hoc sign for sideloading
      run: |
        set -euo pipefail
        APP=build/tvos/Release-appletvos/Runner.app
        for d in "$APP"/Frameworks/*.dylib; do
          [ -f "$d" ] && codesign -f -s - --timestamp=none "$d"
        done
        for f in "$APP"/Frameworks/*.framework; do
          [ -d "$f" ] && codesign -f -s - --timestamp=none "$f"
        done
        for extension in "$APP"/PlugIns/*.appex; do
          [ -d "$extension" ] || continue
          for d in "$extension"/Frameworks/*.dylib; do
            [ -f "$d" ] && codesign -f -s - --timestamp=none "$d"
          done
          for f in "$extension"/Frameworks/*.framework; do
            [ -d "$f" ] && codesign -f -s - --timestamp=none "$f"
          done
          codesign -f -s - --timestamp=none \
            --entitlements tvos/TopShelf/TopShelf.entitlements "$extension"
        done
        codesign -f -s - --timestamp=none \
          --entitlements tvos/Runner/Runner.entitlements "$APP"

        missing=0
        check() {
          if [ -f "$1" ] && [ "$(otool -l "$1" | grep -c LC_CODE_SIGNATURE)" -eq 0 ]; then
            echo "::error::no LC_CODE_SIGNATURE in $1"
            missing=$((missing + 1))
          fi
        }
        check "$APP/Runner"
        for d in "$APP"/Frameworks/*.dylib; do check "$d"; done
        for f in "$APP"/Frameworks/*.framework; do
          check "$f/$(basename "$f" .framework)"
        done
        for extension in "$APP"/PlugIns/*.appex; do
          [ -d "$extension" ] || continue
          check "$extension/$(basename "$extension" .appex)"
          for d in "$extension"/Frameworks/*.dylib; do check "$d"; done
          for f in "$extension"/Frameworks/*.framework; do
            check "$f/$(basename "$f" .framework)"
          done
        done
        if [ "$missing" -ne 0 ]; then
          echo "::error::$missing binary(ies) left unsigned; IPA would not sideload"
          exit 1
        fi
        codesign --verify --deep --strict "$APP"
        echo "all binaries carry LC_CODE_SIGNATURE"

    - name: Create unsigned IPA (release)
      if: github.event_name == 'release'
      run: |
        cd build/tvos/Release-appletvos
        mkdir -p Payload
        cp -R Runner.app Payload/
        zip -qr debrify-${{ github.event.release.tag_name }}-tvos-unsigned.ipa Payload
        rm -rf Payload

    - name: Create unsigned IPA (manual)
      if: github.event_name == 'workflow_dispatch'
      run: |
        cd build/tvos/Release-appletvos
        mkdir -p Payload
        cp -R Runner.app Payload/
        zip -qr debrify-tvos-unsigned.ipa Payload
        rm -rf Payload

    - name: Upload IPA to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: build/tvos/Release-appletvos/debrify-${{ github.event.release.tag_name }}-tvos-unsigned.ipa
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload IPA as artifact (manual)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: debrify-tvos
        path: build/tvos/Release-appletvos/debrify-tvos-unsigned.ipa

  linux:
    if: github.event_name == 'release' || github.event.inputs.job == 'all' || github.event.inputs.job == 'linux'
    # Pinned: both the Flutter runner and private libmpv inherit this image's
    # glibc floor. Ubuntu 22.04 (glibc 2.35) covers Mint 21+, Mint 22 and current
    # SteamOS without importing either distro's multimedia stack.
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev patchelf

    - name: Build private libmpv
      run: |
        mkdir -p build
        docker run --rm \
          -v "$PWD:/src" \
          -w /src \
          ubuntu:22.04 \
          bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y \
              build-essential git pkg-config ninja-build python3-pip nasm yasm \
              autoconf automake libtool-bin libssl-dev zlib1g-dev \
              libasound2-dev libpulse-dev libva-dev libvdpau-dev \
              libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev \
              libxss-dev libxpresent-dev libdrm-dev libgbm-dev \
              libwayland-dev wayland-protocols libxkbcommon-dev \
              libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
              libfribidi-dev python3-jinja2 python3-docutils
            python3 -m pip install --no-cache-dir meson==1.7.0
            scripts/build_linux_libmpv.sh build/private-libmpv
          '

    - name: Setup Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.44.8'
        channel: 'stable'

    - name: Enable Linux desktop
      run: flutter config --enable-linux-desktop

    - name: Get dependencies
      run: flutter pub get

    - name: Build Linux app
      # media_kit_video uses pkg-config at CMake time. Point it at the same
      # private mpv SDK that will be installed into the AppImage so the plugin
      # records DT_NEEDED=libmpv.so.2 instead of Ubuntu 22.04's libmpv.so.1.
      run: PKG_CONFIG_PATH="$PWD/build/private-libmpv/pkgconfig" flutter build linux --release

    # media_kit ships no Linux libmpv. Install our statically consolidated mpv
    # in a plugin-private directory; never expose it through LD_LIBRARY_PATH.
    - name: Install private libmpv into the app bundle
      run: scripts/bundle_linux_mpv.sh build/linux/x64/release/bundle build/private-libmpv

    - name: Create AppImage
      run: |
        # Download appimagetool
        wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
        chmod +x appimagetool-x86_64.AppImage

        # Create AppDir structure
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        mkdir -p AppDir/usr/share/applications

        # Copy built app
        cp -r build/linux/x64/release/bundle/* AppDir/usr/bin/

        # Copy icon
        cp assets/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/debrify.png
        cp assets/app_icon.png AppDir/debrify.png

        # Create desktop file
        cat > AppDir/debrify.desktop << 'EOF'
        [Desktop Entry]
        Name=Debrify
        Comment=Modern debrid companion with torrent search and playlist management
        Exec=debrify
        Icon=debrify
        Type=Application
        Categories=Utility;Network;
        EOF

        cp AppDir/debrify.desktop AppDir/usr/share/applications/

        # Create AppRun. Checked in at linux/AppRun so both arch jobs share one
        # copy — it carries the libmpv and GPU driver path setup.
        cp linux/AppRun AppDir/AppRun
        chmod +x AppDir/AppRun

        # Build AppImage
        VERSION="${{ github.event.release.tag_name }}"
        if [ -z "$VERSION" ]; then VERSION="dev"; fi
        ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run AppDir debrify-${VERSION}-x86_64.AppImage

    - name: Upload AppImage to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: debrify-${{ github.event.release.tag_name }}-x86_64.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload AppImage as artifact (manual)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: debrify-linux
        path: debrify-dev-x86_64.AppImage

  linux-arm64:
    if: github.event_name == 'release' || github.event.inputs.job == 'all' || github.event.inputs.job == 'linux-arm64'
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Linux dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev libasound2-dev patchelf

    # Build inside Ubuntu 22.04 even though GitHub currently only offers the
    # native public ARM runner on 24.04. This keeps both AppImage architectures
    # at the same glibc 2.35 compatibility floor.
    - name: Build private libmpv
      run: |
        mkdir -p build
        docker run --rm \
          -v "$PWD:/src" \
          -w /src \
          ubuntu:22.04 \
          bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y \
              build-essential git pkg-config ninja-build python3-pip nasm yasm \
              autoconf automake libtool-bin libssl-dev zlib1g-dev \
              libasound2-dev libpulse-dev libva-dev libvdpau-dev \
              libgl-dev libegl-dev libx11-dev libxext-dev libxrandr-dev \
              libxss-dev libxpresent-dev libdrm-dev libgbm-dev \
              libwayland-dev wayland-protocols libxkbcommon-dev \
              libfontconfig1-dev libfreetype6-dev libharfbuzz-dev \
              libfribidi-dev python3-jinja2 python3-docutils
            python3 -m pip install --no-cache-dir meson==1.7.0
            scripts/build_linux_libmpv.sh build/private-libmpv
          '

    - name: Setup Flutter (manual for arm64)
      run: |
        # subosito/flutter-action doesn't support linux-arm64, install manually
        # Using stable tag - see https://github.com/subosito/flutter-action/issues/345
        git clone --depth 1 --branch 3.44.8 https://github.com/flutter/flutter.git $RUNNER_TEMP/flutter
        echo "$RUNNER_TEMP/flutter/bin" >> $GITHUB_PATH

    - name: Precache Flutter
      run: |
        flutter precache --linux
        flutter doctor -v

    - name: Enable Linux desktop
      run: flutter config --enable-linux-desktop

    - name: Get dependencies
      run: flutter pub get

    - name: Build Linux app
      run: PKG_CONFIG_PATH="$PWD/build/private-libmpv/pkgconfig" flutter build linux --release

    # See the x64 job — same reason, same script, arm64 bundle path.
    - name: Install private libmpv into the app bundle
      run: scripts/bundle_linux_mpv.sh build/linux/arm64/release/bundle build/private-libmpv

    - name: Create AppImage
      run: |
        # Download appimagetool for aarch64
        wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-aarch64.AppImage
        chmod +x appimagetool-aarch64.AppImage

        # Create AppDir structure
        mkdir -p AppDir/usr/bin
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        mkdir -p AppDir/usr/share/applications

        # Copy built app (arm64 path)
        cp -r build/linux/arm64/release/bundle/* AppDir/usr/bin/

        # Copy icon
        cp assets/app_icon.png AppDir/usr/share/icons/hicolor/256x256/apps/debrify.png
        cp assets/app_icon.png AppDir/debrify.png

        # Create desktop file
        cat > AppDir/debrify.desktop << 'EOF'
        [Desktop Entry]
        Name=Debrify
        Comment=Modern debrid companion with torrent search and playlist management
        Exec=debrify
        Icon=debrify
        Type=Application
        Categories=Utility;Network;
        EOF

        cp AppDir/debrify.desktop AppDir/usr/share/applications/

        # Create AppRun. Checked in at linux/AppRun so both arch jobs share one
        # copy — it carries the libmpv and GPU driver path setup.
        cp linux/AppRun AppDir/AppRun
        chmod +x AppDir/AppRun

        # Build AppImage
        VERSION="${{ github.event.release.tag_name }}"
        if [ -z "$VERSION" ]; then VERSION="dev"; fi

        # Note: appimagetool expects "arm_aarch64" not "aarch64"
        # See: https://github.com/AppImage/AppImageKit/issues/1163
        export ARCH=arm_aarch64
        ./appimagetool-aarch64.AppImage --appimage-extract-and-run AppDir debrify-${VERSION}-arm64.AppImage

    - name: Upload AppImage to Release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v1
      with:
        files: debrify-${{ github.event.release.tag_name }}-arm64.AppImage
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload AppImage as artifact (manual)
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: debrify-linux-arm64
        path: debrify-dev-arm64.AppImage
