name: debrify
description: "A modern torrent search and debrid management app"
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 0.9.0-beta.1+44

environment:
  sdk: ^3.8.1

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  http: ^1.1.0
  pug_flutter: ^0.0.3
  intl: ^0.19.0
  shared_preferences: ^2.2.2
  url_launcher: ^6.2.5
  android_intent_plus: ^5.0.2
  background_downloader: ^9.2.3
  flutter_markdown: ^0.7.4
  permission_handler: ^11.3.1
  path_provider: ^2.1.4
  path: ^1.9.0
  archive: ^4.0.7
  yaml: ^3.1.3
  xml: ^6.5.0
  sqflite: ^2.3.3
  sqflite_common_ffi: ^2.3.3
  ffi: ^2.1.4
  sqlite3: ^2.4.0
  sqlite3_flutter_libs: ^0.5.24
  file_picker: ^10.2.3
  saf_stream: ^0.12.0
  connectivity_plus: ^6.0.3
  window_manager: ^0.3.8
  app_links: ^6.3.2
  crypto: ^3.0.3
  # Pure-Dart AEAD/KDF/ECDH (AesGcm, Hkdf, Argon2id, X25519) for the
  # credential vault, encrypted backups, and remote-control session crypto.
  # No native code, so it works on tvOS without a federated sibling.
  cryptography: ^2.7.0
  # Promoted from transitive (pug_flutter) to direct: SecretVault derives its
  # master key from per-platform hardware identifiers. No tvOS implementation —
  # guard with PlatformUtil.isTvOS before touching it (see secret_vault.dart).
  device_info_plus: ^12.4.0
  flutter_sharing_intent: ^2.0.4
  collection: ^1.19.1
  synchronized: ^3.4.0


  
  # In-app video playback and premium controls
  video_player: ^2.9.2
  wakelock_plus: ^1.2.5
  screen_brightness: ^2.1.6
  volume_controller: ^3.4.0
  
  # media_kit for advanced track APIs
  media_kit: ^1.1.11
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.5
  
  # Image caching for episode posters
  cached_network_image: ^3.3.1
  # Direct dep so we can configure a bigger disk cache than the 200-object
  # default (already transitive via cached_network_image)
  flutter_cache_manager: ^3.4.1

  # App version info
  package_info_plus: ^8.0.0

  # Premium UI and animations
  # 8.x required from Flutter 3.44: 6.x keys a `const` map by FontWeight,
  # which stopped being a primitive-equality type and now fails constant
  # evaluation at build time (analyzer is clean, the kernel snapshot is not).
  google_fonts: ^8.2.1

  # --- Apple TV (tvOS) federated implementations ---
  # A tvOS build only loads plugins that declare a `tvos:` platform key, so
  # each plugin with native Apple code needs its sibling here or the call
  # throws MissingPluginException at runtime (it still COMPILES without them,
  # which is the trap). Inert on Android/iOS/desktop — the endorsed
  # implementation for those platforms is unchanged.
  #
  # NOTE: every one of these is 0.0.x — the tvOS plugin ecosystem is pre-alpha.
  # Treat their behaviour as unverified until exercised on a real Apple TV.
  # media_kit on Apple TV. Neither of these exists on pub.dev — media_kit has
  # no tvOS support at all, so both are local packages under packages/.
  #   libs  = libmpv + ffmpeg xcframeworks (the binaries are gitignored;
  #           re-fetch with its fetch_frameworks.sh)
  #   video = the texture renderer, scaffolded by `flutter-tvos plugin port`
  # Without the libs package media_kit is silently dropped from the tvOS build
  # and every playback call throws MissingPluginException at runtime.
  media_kit_libs_tvos_video:
    path: packages/media_kit_libs_tvos_video
  media_kit_video_tvos:
    path: packages/media_kit_video_tvos

  connectivity_plus_tvos: ^0.0.2
  # device_info_plus_tvos is ABSENT for the same reason as package_info: it
  # wants device_info_plus_platform_interface ^8.1.0 while the plugin ships
  # ^7.x. We never call device_info directly (it arrives via pug_flutter), so
  # nothing of ours depends on it working.
  #
  # package_info_plus_tvos is deliberately ABSENT: it requires
  # package_info_plus_platform_interface ^4.1.0, which NO published
  # package_info_plus uses (10.2.1, the latest, still pins ^3.2.1) — so it
  # cannot resolve against any real version of the plugin it implements.
  # Runner/AppDelegate.swift implements package_info_plus's tiny `getAll`
  # method-channel contract directly from Bundle.main instead. Revisit when
  # the package catches up.
  path_provider_tvos: ^0.0.3
  shared_preferences_tvos: ^0.0.2
  sqflite_tvos: ^0.0.2
  video_player_tvos: ^0.0.1
  wakelock_plus_tvos: ^0.0.1
  animations: ^2.0.11
  provider: ^6.1.2
  youtube_explode_dart: ^3.1.0

# media_kit is vendored under packages/media_kit_patched for Apple TV support:
# an already-resolved NativeLibrary initialization guard, safe NativeCallable
# ownership during disposal, and off-main-isolate libmpv destruction. Without
# these, tvOS playback either cannot start or can deadlock/abort during player
# teardown. Diff the package before upgrading from the 1.2.0 base.
# path_provider_tvos is vendored under packages/path_provider_tvos_patched with
# ONE change: getApplicationSupportDirectory returns a Caches subdirectory
# instead of nil. Upstream is technically right (Application Support cannot be
# created on tvOS) but nil breaks every dependency that asks for it and has no
# tvOS fallback — flutter_cache_manager, google_fonts, background_downloader.
# Everything else is stock 0.0.3 — diff it before upgrading.
dependency_overrides:
  media_kit:
    path: packages/media_kit_patched
  # Android TV uses ExoPlayer and is unaffected. Android phones use MediaKit's
  # restricted FFmpeg build, which omits Blu-ray PGS and other bitmap/text
  # subtitle decoders. Release CI fills this package with a pinned patch build.
  media_kit_libs_android_video:
    path: packages/media_kit_libs_android_video_patched
  # The hosted macOS FFmpeg binary omits Blu-ray PGS and several other common
  # subtitle decoders. This local package keeps MediaKit's framework layout but
  # receives a minimally patched, pinned upstream build in macOS release CI.
  media_kit_libs_macos_video:
    path: packages/media_kit_libs_macos_video_patched
  path_provider_tvos:
    path: packages/path_provider_tvos_patched

dev_dependencies:
  flutter_test:
    sdk: flutter
  path_provider_platform_interface: ^2.1.2
  shared_preferences_platform_interface: ^2.4.1

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: assets/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/app_icon_foreground.png
  macos:
    generate: true
    image_path: assets/app_icon.png
  windows:
    generate: true
    image_path: assets/app_icon.png
  linux:
    generate: true
    image_path: assets/app_icon.png
  web:
    generate: true
    image_path: assets/app_icon.png

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/app_icon.png
    - assets/app_icon_foreground.png
    - assets/images/profile_gate_lighthouse.png
    - assets/images/profile_avatars/
    - assets/splash_logo.png
    - assets/config/app_remote_config.json
    - assets/config/engines/

  # Bundled subtitle fonts
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
    - family: Merriweather
      fonts:
        - asset: assets/fonts/Merriweather-Regular.ttf
    - family: SourceSerifPro
      fonts:
        - asset: assets/fonts/SourceSerifPro-Regular.ttf
    - family: FiraMono
      fonts:
        - asset: assets/fonts/FiraMono-Regular.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf

  # Style fonts — the IPTV premium looks (dev/design/plans/IPTV_PREMIUM_STYLES_PLAN.md).
  # Static faces referenced by plain fontFamily strings; never via GoogleFonts.
    - family: Fraunces72
      fonts:
        - asset: assets/fonts/Fraunces72pt-Regular.ttf
        - asset: assets/fonts/Fraunces72pt-Italic.ttf
          style: italic
    - family: Fraunces9
      fonts:
        - asset: assets/fonts/Fraunces9pt-Italic.ttf
          style: italic
    - family: SpaceGrotesk
      fonts:
        - asset: assets/fonts/SpaceGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/SpaceGrotesk-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

  # To add assets to your application, add an assets section, like this:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
